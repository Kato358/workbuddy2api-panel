name: Docker image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git SHA or ref to build (empty = current branch)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: docker-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Image tags
        id: image
        run: |
          set -euo pipefail
          name="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          sha="$(git rev-parse --short HEAD)"
          {
            echo "name=${name}"
            echo "sha=${sha}"
            echo "tags<<EOF"
            echo "${name}:latest"
            echo "${name}:sha-${sha}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          echo "tags:"
          echo "  ${name}:latest"
          echo "  ${name}:sha-${sha}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image tags"
            echo "- \`${{ steps.image.outputs.name }}:latest\`"
            echo "- \`${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
